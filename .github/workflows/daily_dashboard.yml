name: Daily trends dashboard

# Rebuilds docs/index.html from data/matches/*.csv.
# Runs right after "Update match data" finishes, with timed backups
# (40 min after each data run) in case the chained trigger is missed.

on:
  workflow_run:
    workflows: ["Update match data"]
    types: [completed]
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 5 * * *'
    - cron: '10 13 * * *'
  workflow_dispatch:
    inputs:
      today:
        description: 'Pretend today is YYYY-MM-DD (testing only). Leave empty for the real date.'
        required: false
        default: ''

permissions:
  contents: write

# One job at a time may write to the repo (shared with update_data.yml).
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Build trends dashboard
        env:
          TODAY: ${{ github.event.inputs.today }}
        run: |
          ARGS=()
          if [ -n "$TODAY" ]; then ARGS+=(--today "$TODAY"); fi
          python -m engine.trends.run "${ARGS[@]}" | tee run_summary.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat run_summary.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save dashboard to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/trends/latest.json
          git diff --staged --quiet || git commit -m "Update dashboard [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
