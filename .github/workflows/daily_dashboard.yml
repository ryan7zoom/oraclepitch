name: Daily dashboard

on:
  schedule:
    - cron: '0 4 * * *'      # UTC 04:00
    - cron: '0 12 * * *'     # UTC 12:00
    - cron: '30 23 * * *'    # UTC 23:30 (picks up the evening's results)
  workflow_dispatch:

permissions:
  contents: write

# One job at a time may write to the repo.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 1. Update match data (football-data.co.uk + recent ESPN results)
        run: python -m engine.data.update --espn-budget 150

      - name: 2. Run the model, grade past predictions, build the page
        run: python -m engine.model.run

      - name: Save to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --staged --quiet; then
            git commit -m "Daily update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
