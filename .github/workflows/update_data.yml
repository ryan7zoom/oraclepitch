name: Update match data (manual)

on:
  workflow_dispatch:
    inputs:
      espn_budget:
        description: 'Max ESPN requests this run (raise it, e.g. 1500, to speed up the offsides backfill)'
        required: false
        default: '600'
      full:
        description: 'Refetch every football-data.co.uk season (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

# One job at a time may write to the repo (this one and the dashboard job).
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Update match data (manual)
        run: |
          ARGS="--espn-budget ${{ github.event.inputs.espn_budget || '600' }}"
          if [ "${{ github.event.inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          python -m engine.data.update $ARGS | tee data_update.log

      - name: Job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/=== MATCH DATA UPDATE ===/,$p' data_update.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches
          if ! git diff --staged --quiet; then
            git commit -m "Update match data [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
