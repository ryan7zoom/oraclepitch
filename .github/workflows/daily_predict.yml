name: Daily EPL Predictions

on:
  schedule:
    - cron: '0 4 * * *'   # UTC 04:00
    - cron: '0 12 * * *'  # UTC 12:00
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run daily predictions
        run: python -m engine.main --date today
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      # The historical-fixtures cache (data/historical/*.json) built by
      # main.py's caching logic (see engine/main.py's
      # _load_cached_detailed_results / _save_cached_detailed_results)
      # needs to be committed back to the repo, or every run starts from
      # zero and re-burns the daily API quota re-fetching data that
      # hasn't changed. This step commits any updated cache/prediction
      # files back to the repository.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Update predictions and historical cache [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
