name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: 'Start season (e.g., 2021)'
        required: false
        default: '2021'
      end_season:
        description: 'End season (e.g., 2025)'
        required: false
        default: '2025'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # This backtest uses football-data.co.uk (a free, no-key, plain-CSV
      # historical archive) for both match results and real Bet365
      # historical odds - see engine/backtest/simulator.py's module
      # docstring. No API_FOOTBALL_KEY or any secret is needed for this
      # workflow, since football-data.co.uk requires no authentication.
      #
      # ODDS COVERAGE NOTE: real odds are only available for match_winner
      # and match_total_goals (Over/Under 2.5 line only). Double chance,
      # team total goals, and shots on target markets will correctly show
      # zero bets in the report, since no real odds source covers them
      # yet - this is stated explicitly in the generated report, not a
      # bug in the workflow. Corners has no odds source either, but real
      # historical corners data IS used for a separate calibration check
      # (predicted probability vs actual frequency) included in the report.
      - name: Run backtest
        run: python -m engine.backtest.simulator --start ${{ github.event.inputs.start_season }} --end ${{ github.event.inputs.end_season }}

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: data/backtest_report.txt
