name: Remove old engine

# One-off, manual. Deletes the old streak engine, then checks the new pipeline
# still imports and all tests pass BEFORE committing. If a check fails nothing is pushed.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Remove old engine
        run: bash scripts/remove_old_engine.sh

      - name: Check nothing broke
        run: |
          python -c "import engine.data.update, engine.trends.run, engine.trends.cli; print('imports ok')"
          python -m unittest tests.test_trends tests.test_data_layer

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet || git commit -m "Remove old engine [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
