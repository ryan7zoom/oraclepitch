<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPL Match Preview Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --text-dim: #9aa0ab;
    --accent: #4fd1c5;
    --value-high: #1f6f5c;
    --value-med: #2c4a63;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  footer {
    margin-top: 20px;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
  .no-matches {
    padding: 40px;
    color: var(--text-dim);
    text-align: center;
  }

  .section-heading {
    font-size: 1.1rem;
    margin: 32px 0 12px 0;
  }
  .mismatch-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .mismatch-card.strength-strong { border-left: 4px solid var(--value-high); }
  .mismatch-card.strength-solid { border-left: 4px solid var(--value-med); }
  .mismatch-card.strength-watch { border-left: 4px solid #7a6a2c; }
  .mismatch-title { font-weight: 600; margin-bottom: 6px; }
  .mismatch-subheading {
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 10px;
    margin-bottom: 2px;
  }
  .mismatch-line {
    font-size: 0.85rem;
    color: var(--text);
    margin: 2px 0;
  }
  .mismatch-alignment {
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 6px;
  }
  .alignment-aligned { color: var(--value-high); }
  .alignment-mixed { color: #c9a227; }
  .alignment-conflict { color: #c94d3f; }
  .mismatch-combined {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .mismatch-opportunity {
    font-size: 0.85rem;
    color: var(--accent);
    margin-top: 4px;
  }
  .streak-category { margin-bottom: 20px; }
  .streak-team-name { font-weight: 600; margin: 10px 0 4px 0; }
  .streak-line {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin: 2px 0 2px 12px;
  }
  .streak-line.flagged { color: var(--text); }
  .mismatch-flag { color: var(--accent); font-size: 0.78rem; }
</style>
</head>
<body>
<header>
  <h1>EPL Match Preview Dashboard</h1>
</header>

<div class="no-matches">No fixtures today.</div>

</body>
</html>
