<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trends</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --text-dim: #9aa0ab;
    --accent: #4fd1c5;
    --value-high: #1f6f5c;
    --value-med: #2c4a63;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
  .no-matches {
    padding: 24px 8px;
    color: var(--text-dim);
    text-align: center;
    font-size: 0.9rem;
  }

  .day-section { margin-bottom: 32px; }
  .day-heading {
    font-size: 1.15rem;
    margin: 0 0 14px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .league-section { margin-bottom: 20px; }
  .league-heading {
    font-size: 0.95rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 8px 4px;
  }

  /* Collapsed-by-default match cards - native <details>/<summary>,
     no JavaScript. See details[open] rule below for the expand marker
     rotation. */
  .match-details {
    border-bottom: 1px solid var(--border);
  }
  .match-details summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
  }
  .match-details summary::-webkit-details-marker { display: none; }
  .match-details summary::before {
    content: "\25B6";
    display: inline-block;
    margin-right: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
    transition: transform 0.15s ease;
  }
  .match-details[open] summary::before {
    transform: rotate(90deg);
  }
  .match-teams {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--card-bg);
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .match-body {
    padding: 4px 4px 16px 20px;
  }

  .section-heading {
    font-size: 0.95rem;
    margin: 18px 0 10px 0;
  }
  .mismatch-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .mismatch-card.strength-strong { border-left: 4px solid var(--value-high); }
  .mismatch-card.strength-solid { border-left: 4px solid var(--value-med); }
  .mismatch-card.strength-watch { border-left: 4px solid #7a6a2c; }
  .mismatch-title { font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; }
  .mismatch-subheading {
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 10px;
    margin-bottom: 2px;
  }
  .mismatch-line {
    font-size: 0.85rem;
    color: var(--text);
    margin: 2px 0;
  }
  .mismatch-alignment {
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 6px;
  }
  .alignment-aligned { color: var(--value-high); }
  .alignment-mixed { color: #c9a227; }
  .alignment-conflict { color: #c94d3f; }
  .mismatch-combined {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .mismatch-opportunity {
    font-size: 0.85rem;
    color: var(--accent);
    margin-top: 4px;
  }
  .streak-team-name { font-weight: 600; margin: 10px 0 4px 0; font-size: 0.85rem; }
  .streak-line {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin: 2px 0 2px 12px;
  }
</style>
</head>
<body>
<header>
  <h1>Trends</h1>
</header>

<div class="no-matches">No fixtures today.</div>

</body>
</html>
